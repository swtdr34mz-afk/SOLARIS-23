# Builds SOLARIUM-23A for Windows (VST3, Standalone) and the Mac (VST3, AU, Standalone; Apple Silicon and Intel) and Linux (VST3, LV2, Standalone) on every push,
# checks it with pluginval (Windows) and auval (Mac), and runs the engine's tests. The zips are under the run's "Artifacts";
# a tag v* (or a release published on GitHub) also puts them in its release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:                               # a release published on GitHub (its tag v*): the zips added to it
    types: [published]

permissions:
  contents: write

env:
  # what JUCE needs to build on Linux
  LINUX_DEPS: >-
    libasound2-dev libjack-jackd2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev
    libxcomposite-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

jobs:
  # the engine's tests (tests/engine_tests.cpp): every program at three rates, any buffer size, every parameter swept,
  # every effect, all at once; no JUCE needed
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release && cmake --build build-tests --parallel 4
      - name: run
        run: build-tests/engine_tests

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          # the Mac: on GitHub's Intel Mac (the Apple Silicon runners found no machine, Nov 2026); the plugins are
          # built for both Apple Silicon and Intel in one file (CMAKE_OSX_ARCHITECTURES), as for ARIA
          - os: macos-15-intel
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: pluginval (Windows)
        # the plugin checked as a host would: loading, its parameters fuzzed, state saved and restored, the editor
        # opened, every buffer size and rate (Tracktion's pluginval, strictness 8)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath pluginval/pluginval.exe -ArgumentList '--strictness-level','8','--timeout-ms','600000','--output-dir','pluginval-log','--validate','"build/Solaris23_artefacts/Release/VST3/SOLARIUM-23A.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: pluginval-log
          path: pluginval-log
          if-no-files-found: ignore

      - name: auval (macOS)
        # the AU checked as Logic would (Apple's auval): a synth (aumu), SOLARIUM-23A's code So23, maker Swtd
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Solaris23_artefacts/Release/AU/SOLARIUM-23A.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu So23 Swtd

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = "build/Solaris23_artefacts/Release"
          $o = "SOLARIUM-23A-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/SOLARIUM-23A.vst3" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath SOLARIUM-23A-Windows.zip

      - name: package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          a="build/Solaris23_artefacts/Release"
          o=SOLARIUM-23A-macOS
          mkdir -p $o
          cp -R "$a/VST3/SOLARIUM-23A.vst3" "$a/AU/SOLARIUM-23A.component" "$a/Standalone/SOLARIUM-23A.app" $o/
          for b in $o/*.vst3 $o/*.component $o/*.app; do codesign --force --deep -s - "$b"; done
          lipo -info "$o/SOLARIUM-23A.vst3/Contents/MacOS/SOLARIUM-23A"
          cp README.md $o/
          ditto -c -k --sequesterRsrc --keepParent $o $o.zip

      - name: pluginval (Linux)
        # the same check as on Windows, in a virtual screen. Up to three tries: pluginval's own VST3 host (stock JUCE 8
        # code) can crash by itself at the end of its parameter fuzz test (Tracktion/pluginval#177); a plug-in that
        # really fails, fails all three
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          for i in 1 2 3; do
            xvfb-run -a ./pluginval --strictness-level 8 --timeout-ms 600000 --validate "build/Solaris23_artefacts/Release/VST3/SOLARIUM-23A.vst3" && exit 0
            echo "::warning::pluginval try $i did not pass"
          done
          exit 1

      - name: package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          a="build/Solaris23_artefacts/Release"
          o=SOLARIUM-23A-Linux
          mkdir -p $o
          cp -R "$a/VST3/SOLARIUM-23A.vst3" "$a/LV2/SOLARIUM-23A.lv2" "$a/Standalone/SOLARIUM-23A" $o/
          cp README.md $o/
          tar czf $o.tar.gz $o

      - uses: actions/upload-artifact@v4
        with:
          name: SOLARIUM-23A-${{ matrix.name }}
          path: |
            SOLARIUM-23A-*.zip
            SOLARIUM-23A-*.tar.gz

      - name: release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SOLARIUM-23A-*.zip
            SOLARIUM-23A-*.tar.gz
